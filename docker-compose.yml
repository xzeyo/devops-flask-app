# TW2 1.2 - Flask app + PostgreSQL, two services that communicate
services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/hello
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hello
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hello"]
      interval: 2s
      timeout: 2s
      retries: 20
