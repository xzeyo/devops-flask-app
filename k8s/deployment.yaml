# TW2 2.2 - Deployment for the Flask Hello World app
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-flask-app
  labels:
    app: devops-flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-flask-app
  template:
    metadata:
      labels:
        app: devops-flask-app
    spec:
      containers:
      - name: web
        image: devops-flask-app:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
