# TW2 2.3 - NodePort Service exposing the Flask app
# kind maps host 30080 -> node 30080, so from the host:
#   curl http://localhost:30080/
apiVersion: v1
kind: Service
metadata:
  name: devops-flask-app
spec:
  type: NodePort
  selector:
    app: devops-flask-app
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30080
